    :root {
      --ink: #f3f4ec;
      --muted: #9a9d94;
      --dim: #666a63;
      --ground: #10120f;
      --surface: #171a16;
      --rule: #353932;
      --accent: #d9ff5a;
      --accent-ink: #10120f;
      --display: "Barlow Condensed", "Arial Narrow", sans-serif;
      --body: "DM Sans", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 390px;
      height: 844px;
      margin: 0;
      overflow: hidden;
      background: var(--ground);
      color: var(--ink);
    }

    body {
      font-family: var(--body);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input { font: inherit; }

    button { cursor: pointer; }

    .app {
      position: relative;
      display: grid;
      grid-template-rows: 76px 1fr 68px;
      width: 390px;
      height: 844px;
      isolation: isolate;
      background:
        linear-gradient(90deg, transparent 19px, rgba(255,255,255,.025) 20px, transparent 21px),
        var(--ground);
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      box-shadow: inset 0 -1px 0 var(--rule);
    }

    .wordmark {
      display: inline-flex;
      align-items: flex-start;
      font-family: var(--display);
      font-size: 29px;
      font-weight: 800;
      line-height: 24px;
      letter-spacing: -.045em;
      text-transform: uppercase;
    }

    .wordmark .e {
      position: relative;
      display: inline-block;
      margin-left: .035em;
      transform: skewX(-9deg);
    }

    .wordmark .e::before {
      content: "";
      position: absolute;
      top: .32em;
      left: -.05em;
      width: .62em;
      height: 2px;
      background: var(--ground);
      box-shadow: 0 0 0 1px var(--ground);
    }

    .wordmark .e::after {
      content: "";
      position: absolute;
      top: .3em;
      left: .07em;
      width: .42em;
      height: 2px;
      background: var(--ink);
      transform: translateX(.12em);
    }

    .live-status {
      display: grid;
      grid-template-columns: 8px auto;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-family: var(--display);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .08em;
      line-height: 16px;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      transform: rotate(45deg);
    }

    main {
      min-height: 0;
      overflow: hidden;
      padding: 16px 20px 0;
    }

    .position {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-family: var(--display);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .105em;
      line-height: 16px;
      text-transform: uppercase;
    }

    .position strong {
      color: var(--ink);
      font-weight: 600;
    }

    .exercise-plate {
      position: relative;
      height: 152px;
      margin: 8px 0 12px;
      overflow: hidden;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      isolation: isolate;
    }

    h1 {
      position: absolute;
      z-index: 3;
      top: 19px;
      left: 0;
      width: 132px;
      margin: 0;
      font-family: var(--display);
      font-size: 53px;
      font-weight: 700;
      letter-spacing: -.05em;
      line-height: .76;
      text-transform: uppercase;
    }

    h1 span { display: block; }

    .exercise-media {
      position: absolute;
      z-index: 1;
      inset: 0 0 0 auto;
      width: 280px;
      margin: 0;
      overflow: hidden;
      background: var(--accent);
      clip-path: polygon(14% 0, 100% 0, 100% 100%, 0 100%);
    }

    .exercise-media img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 34% 49%;
      filter: grayscale(1) contrast(1.45) brightness(.88);
      mix-blend-mode: multiply;
      opacity: .9;
      transform: scale(1.14);
    }

    .exercise-media::before {
      content: "";
      position: absolute;
      z-index: 2;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(16,18,15,.7), transparent 24%),
        radial-gradient(circle, rgba(16,18,15,.42) 0 1px, transparent 1.25px);
      background-size: auto, 4px 4px;
      pointer-events: none;
    }

    .exercise-media::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      right: 0;
      width: 16px;
      height: 100%;
      background: repeating-linear-gradient(180deg, var(--ground) 0 2px, transparent 2px 8px);
      opacity: .7;
      pointer-events: none;
    }

    .exercise-media figcaption {
      position: absolute;
      z-index: 3;
      right: 16px;
      bottom: 0;
      padding: 5px 8px 4px;
      background: var(--ground);
      color: var(--accent);
      font-family: var(--display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      line-height: 1;
      text-transform: uppercase;
    }

    .movement-index {
      position: absolute;
      z-index: 3;
      left: 0;
      bottom: 11px;
      color: var(--muted);
      font-family: var(--display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      line-height: 12px;
      text-transform: uppercase;
    }

    .movement-index::before {
      content: "";
      display: inline-block;
      width: 22px;
      height: 2px;
      margin-right: 7px;
      background: var(--accent);
      vertical-align: middle;
    }

    .prescription {
      display: grid;
      grid-template-columns: 60px 1fr;
      align-items: center;
      min-height: 40px;
      box-shadow: inset 0 1px 0 var(--rule), inset 0 -1px 0 var(--rule);
    }

    .prescription-label {
      color: var(--muted);
      font-family: var(--display);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .12em;
      line-height: 16px;
      text-transform: uppercase;
    }

    .prescription-values {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      color: var(--ink);
      font-family: var(--display);
      font-size: 19px;
      font-weight: 600;
      letter-spacing: .025em;
      line-height: 24px;
      font-variant-numeric: tabular-nums;
      text-transform: uppercase;
    }

    .prescription-values span:not(:last-child)::after {
      content: "/";
      margin-left: 17px;
      color: var(--dim);
      font-weight: 500;
    }

    .logger-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 16px 0 8px;
    }

    .logger-heading h2 {
      margin: 0;
      font-family: var(--display);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .11em;
      line-height: 20px;
      text-transform: uppercase;
    }

    .logger-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 14px;
    }

    .actual-grid {
      display: grid;
      grid-template-columns: 175px 1px 174px;
      height: 112px;
      box-shadow: inset 0 1px 0 var(--rule), inset 0 -1px 0 var(--rule);
    }

    .vertical-rule { background: var(--rule); }

    .metric {
      display: grid;
      grid-template-columns: 1fr 48px;
      grid-template-rows: 1fr 1fr;
      min-width: 0;
      padding: 10px 10px 10px 0;
    }

    .metric + .vertical-rule + .metric {
      padding: 10px 0 10px 16px;
    }

    .metric-label {
      align-self: start;
      color: var(--muted);
      font-family: var(--display);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .12em;
      line-height: 16px;
      text-transform: uppercase;
    }

    .metric-value {
      align-self: end;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      font-family: var(--display);
      font-size: 53px;
      font-weight: 600;
      letter-spacing: -.04em;
      line-height: .68;
      font-variant-numeric: tabular-nums;
    }

    .metric-value small {
      color: var(--muted);
      margin-bottom: 2px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .06em;
      line-height: 16px;
      text-transform: uppercase;
    }

    .stepper {
      grid-column: 2;
      grid-row: 1 / span 2;
      display: grid;
      grid-template-rows: 44px 44px;
      gap: 4px;
      align-content: center;
    }

    .stepper button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-left: 1px solid var(--rule);
      background: transparent;
      color: var(--ink);
      font-family: var(--display);
      font-size: 25px;
      font-weight: 500;
      line-height: 1;
      transition: color 120ms ease, background-color 120ms ease, transform 120ms ease;
    }

    .stepper button:active,
    .log-set:active,
    .nav-button:active { transform: scale(.96); }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .note {
      display: grid;
      grid-template-columns: 108px 1fr;
      align-items: center;
      height: 56px;
      box-shadow: inset 0 -1px 0 var(--rule);
    }

    .note label {
      color: var(--muted);
      font-family: var(--display);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .105em;
      line-height: 14px;
      text-transform: uppercase;
    }

    .note input {
      width: 100%;
      height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
      outline: none;
    }

    .note input::placeholder { color: #7b7f77; opacity: 1; }

    .log-set {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 56px;
      margin-top: 12px;
      padding: 0 16px;
      border: 0;
      border-radius: 2px;
      background: var(--accent);
      color: var(--accent-ink);
      font-family: var(--display);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .075em;
      text-transform: uppercase;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.2);
      transition: transform 120ms ease, background-color 120ms ease;
    }

    .log-set .action-number {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .1em;
      opacity: .68;
    }

    .feedback-rest {
      display: grid;
      grid-template-columns: 175px 1px 174px;
      height: 60px;
      margin-top: 12px;
      box-shadow: inset 0 1px 0 var(--rule), inset 0 -1px 0 var(--rule);
    }

    .saved {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
    }

    .saved strong {
      display: block;
      color: var(--ink);
      font-size: 12px;
      font-weight: 500;
    }

    .check {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: var(--display);
      font-size: 13px;
      font-weight: 700;
      transform: rotate(45deg);
    }

    .check span { transform: rotate(-45deg); }

    .rest {
      display: grid;
      grid-template-columns: 1fr 48px;
      align-items: center;
      padding-left: 16px;
    }

    .rest-copy {
      color: var(--muted);
      font-family: var(--display);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .rest-copy strong {
      display: block;
      margin-top: 2px;
      color: var(--ink);
      font-size: 18px;
      letter-spacing: .04em;
      font-variant-numeric: tabular-nums;
    }

    .rest button {
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
    }

    .session-nav {
      display: grid;
      grid-template-columns: 56px 1fr 56px;
      align-items: stretch;
      margin: 0 20px;
      background: var(--ground);
      box-shadow: inset 0 1px 0 var(--rule);
    }

    .nav-button {
      display: grid;
      place-items: center;
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-family: var(--display);
      font-size: 25px;
      transition: color 120ms ease, transform 120ms ease;
    }

    .nav-position {
      display: grid;
      place-content: center;
      gap: 3px;
      text-align: center;
      color: var(--muted);
      font-family: var(--display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .nav-position strong {
      color: var(--ink);
      font-size: 15px;
      letter-spacing: .08em;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
