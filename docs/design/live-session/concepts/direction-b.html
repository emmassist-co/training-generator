    :root {
      --paper: #f2f1ec;
      --panel: #e6e6e0;
      --ink: #171c24;
      --muted: #626765;
      --rule: #c6c7c1;
      --rule-strong: #7f8482;
      --accent: #2c55d8;
      --accent-pressed: #2448bb;
      --white: #ffffff;
      --sans: "Instrument Sans", sans-serif;
      --mono: "IBM Plex Mono", monospace;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 390px;
      height: 844px;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
    }

    body {
      font-family: var(--sans);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button,
    input {
      font: inherit;
    }

    button { cursor: pointer; }

    .instrument {
      position: relative;
      display: grid;
      grid-template-rows: 66px 1fr 64px;
      width: 390px;
      height: 844px;
      background: var(--paper);
    }

    .instrument::before,
    .instrument::after {
      position: absolute;
      z-index: 2;
      top: 66px;
      left: 0;
      width: 4px;
      content: "";
    }

    .instrument::before {
      bottom: 64px;
      background: var(--rule);
    }

    .instrument::after {
      height: 143px;
      background: var(--accent);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--rule-strong);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-mark {
      display: block;
      width: 25px;
      height: 22px;
    }

    .brand-word {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -1.4px;
      line-height: 1;
    }

    .live {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .live-signal {
      position: relative;
      width: 11px;
      height: 11px;
      border: 1px solid var(--accent);
    }

    .live-signal::after {
      position: absolute;
      inset: 3px;
      background: var(--accent);
      content: "";
    }

    main {
      min-height: 0;
      padding: 16px 20px 0 24px;
    }

    .coordinates {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-bottom: 14px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .coordinates span:last-child { text-align: right; }
    .coordinates strong { color: var(--accent); font-weight: 500; }

    h1 {
      margin: 0;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: -.045em;
      line-height: .98;
    }

    .exercise-spec {
      margin: 8px 0 15px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .01em;
    }

    .plan {
      display: grid;
      grid-template-columns: 62px repeat(3, 1fr);
      align-items: stretch;
      height: 58px;
      margin: 0 -20px 0 -20px;
      padding-left: 20px;
      background: var(--panel);
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }

    .plan-label {
      display: flex;
      align-items: center;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .plan-value {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 4px;
      padding: 17px 13px 0 0;
      font-family: var(--mono);
      font-size: 18px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .plan-value + .plan-value {
      border-left: 1px solid var(--rule);
      padding-left: 10px;
    }

    .plan-value small {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .actual-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 47px;
      border-bottom: 1px solid var(--rule-strong);
    }

    .actual-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .actual-title::before {
      width: 18px;
      height: 2px;
      background: var(--accent);
      content: "";
    }

    .actual-status {
      color: var(--muted);
      font-size: 11px;
    }

    .measure {
      display: grid;
      grid-template-columns: 58px 46px 1fr 46px 57px;
      align-items: center;
      min-height: 72px;
      border-bottom: 1px solid var(--rule);
    }

    .measure-label {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .stepper {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      padding: 0;
      border: 1px solid var(--rule-strong);
      border-radius: 3px;
      background: transparent;
      color: var(--ink);
      font-family: var(--mono);
      font-size: 20px;
      line-height: 1;
      transition: background-color 100ms ease, color 100ms ease, transform 100ms ease;
    }

    .stepper:active,
    .log-set:active,
    .nav-button:active,
    .rest-button:active {
      transform: scale(.96);
    }

    .measure-output {
      min-width: 0;
      text-align: center;
      font-family: var(--mono);
      font-size: 31px;
      font-weight: 500;
      letter-spacing: -.035em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .measure-output small {
      margin-left: 4px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .plan-ref {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      line-height: 1.35;
      text-align: right;
      text-transform: uppercase;
    }

    .plan-ref strong {
      display: block;
      color: var(--ink);
      font-size: 10px;
      font-weight: 500;
    }

    .note-row {
      display: grid;
      grid-template-columns: 78px 1fr;
      align-items: center;
      min-height: 57px;
      border-bottom: 1px solid var(--rule-strong);
    }

    .note-row label {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .05em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .note-row input {
      width: 100%;
      height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 13px;
      outline: none;
    }

    .note-row input::placeholder { color: var(--muted); opacity: 1; }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .log-set {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 56px;
      margin-top: 13px;
      padding: 0 18px;
      border: 0;
      border-radius: 3px;
      background: var(--accent);
      color: var(--white);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .015em;
      transition: background-color 100ms ease, transform 100ms ease;
    }

    .log-set:hover { background: var(--accent-pressed); }

    .log-code {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .06em;
    }

    .recovery {
      display: grid;
      grid-template-columns: 1fr 142px;
      height: 61px;
      margin-top: 11px;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }

    .saved {
      display: grid;
      grid-template-columns: 25px 1fr;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .saved-check {
      display: grid;
      place-items: center;
      width: 21px;
      height: 21px;
      background: var(--accent);
      color: var(--white);
      font-size: 12px;
      font-weight: 700;
    }

    .saved-copy strong,
    .saved-copy span {
      display: block;
      white-space: nowrap;
    }

    .saved-copy strong {
      font-size: 11px;
      font-weight: 600;
    }

    .saved-copy span {
      margin-top: 2px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    .rest-button {
      display: grid;
      grid-template-columns: 1fr 33px;
      align-items: center;
      width: 100%;
      min-width: 0;
      padding: 0 0 0 14px;
      border: 0;
      border-left: 1px solid var(--rule);
      background: transparent;
      color: var(--ink);
      text-align: left;
      transition: transform 100ms ease;
    }

    .rest-copy span,
    .rest-copy strong { display: block; }

    .rest-copy span {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .rest-copy strong {
      margin-top: 4px;
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .play {
      color: var(--muted);
      font-size: 13px;
      transform: translateX(1px);
    }

    .bottom-nav {
      display: grid;
      grid-template-columns: 64px 1fr 64px;
      align-items: center;
      padding: 0 12px;
      border-top: 1px solid var(--rule-strong);
      background: #e9e9e4;
    }

    .nav-button {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      transition: color 100ms ease, transform 100ms ease;
    }

    .nav-button.next { justify-self: end; }

    .nav-button svg {
      width: 23px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    .route {
      text-align: center;
    }

    .route span,
    .route strong { display: block; }

    .route span {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .route strong {
      margin-top: 4px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .04em;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="instrument" aria-label="Flue active training session concept">
    <header class="topbar">
      <div class="brand" aria-label="Flue">
        <svg class="brand-mark" viewBox="0 0 25 22" aria-hidden="true">
          <path d="M1 3.5h15M1 11h23M1 18.5h15" fill="none" stroke="currentColor" stroke-width="3"/>
          <path d="M16 3.5 23.5 11 16 18.5" fill="none" stroke="#2c55d8" stroke-width="3"/>
        </svg>
        <span class="brand-word">flue</span>
      </div>
      <div class="live" aria-label="Session live for 28 minutes 14 seconds">
        <span class="live-signal" aria-hidden="true"></span>
        <span>Live / 28:14</span>
      </div>
    </header>

    <main>
      <div class="coordinates" aria-label="Exercise and set position">
        <span>Exercise <strong>1/5</strong></span>
        <span>Set <strong>1 of 3</strong></span>
      </div>

      <h1>Cable Row</h1>
      <p class="exercise-spec">Seated · neutral grip · controlled return</p>

      <section class="plan" aria-label="Planned set: 10 reps, 50 kilograms, 75 seconds rest">
        <span class="plan-label">Planned</span>
        <span class="plan-value">10 <small>reps</small></span>
        <span class="plan-value">50 <small>kg</small></span>
        <span class="plan-value">75 <small>s</small></span>
      </section>

      <section aria-labelledby="actual-heading">
        <div class="actual-head">
          <h2 class="actual-title" id="actual-heading">Actual set</h2>
          <span class="actual-status">Ready to record</span>
        </div>

        <div class="measure">
          <span class="measure-label">Reps</span>
          <button class="stepper" type="button" aria-label="Decrease reps">−</button>
          <output class="measure-output" aria-label="Actual reps">10</output>
          <button class="stepper" type="button" aria-label="Increase reps">+</button>
          <span class="plan-ref">Plan<strong>10</strong></span>
        </div>

        <div class="measure">
          <span class="measure-label">Load</span>
          <button class="stepper" type="button" aria-label="Decrease load">−</button>
          <output class="measure-output" aria-label="Actual load">50<small>kg</small></output>
          <button class="stepper" type="button" aria-label="Increase load">+</button>
          <span class="plan-ref">Step<strong>2.5</strong></span>
        </div>

        <div class="note-row">
          <label for="set-note">Set note<br>(optional)</label>
          <input id="set-note" type="text" placeholder="Form, pain, or adjustment…">
        </div>

        <button class="log-set" type="button">
          <span>Log set</span>
          <span class="log-code">SET 01 →</span>
        </button>

        <div class="recovery">
          <div class="saved" role="status" aria-label="Session data saved">
            <span class="saved-check" aria-hidden="true">✓</span>
            <span class="saved-copy"><strong>Session data saved</strong><span>14:32 · synced</span></span>
          </div>
          <button class="rest-button" type="button" aria-label="Start 1 minute 15 second rest timer">
            <span class="rest-copy"><span>Rest / start</span><strong>01:15</strong></span>
            <span class="play" aria-hidden="true">▶</span>
          </button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Exercise navigation">
      <button class="nav-button" type="button" aria-label="Previous exercise">
        <svg viewBox="0 0 24 16" fill="none" aria-hidden="true"><path d="M9 2 3 8l6 6M3 8h18"/></svg>
      </button>
      <div class="route"><span>Session route</span><strong>01 — 05</strong></div>
      <button class="nav-button next" type="button" aria-label="Next exercise">
        <svg viewBox="0 0 24 16" fill="none" aria-hidden="true"><path d="m15 2 6 6-6 6M21 8H3"/></svg>
      </button>
    </nav>
  </div>
</body>
</html>
